name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e '.[dev]' pytest-shard
      - run: pytest -n auto --shard-id=${{ matrix.shard }} --num-shards=2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build

  docker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api-check
          cache-to: type=gha,mode=max,scope=api-check

  tests:
    if: always()
    needs: [test-shard, web, docker-check]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.test-shard.result }}" = "success" ] && [ "${{ needs.web.result }}" = "success" ] && [ "${{ needs.docker-check.result }}" = "success" ] || {
            echo "shards=${{ needs.test-shard.result }} web=${{ needs.web.result }} docker-check=${{ needs.docker-check.result }}"; exit 1; }

  build:
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/metril/pi-kiosk-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: meta-display
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/metril/pi-kiosk-display
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: display
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-display.outputs.tags }}
          labels: ${{ steps.meta-display.outputs.labels }}
          cache-from: type=gha,scope=display
          cache-to: type=gha,mode=max,scope=display
