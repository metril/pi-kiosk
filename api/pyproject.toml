[project]
name = "kiosk-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic-settings>=2.4", "aiomqtt>=2.3"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pytest-asyncio", "respx", "pytest-shard"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kiosk_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
